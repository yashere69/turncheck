[project]
name = "turncheck"
version = "0.2.0"
description = "Regression tests for WhatsApp agents: replay Cloud API webhooks, assert on replies, tool calls, duplicates and the 24-hour window."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yash Sharma" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]
# the versions the pywa compatibility tests were written against
compat = ["pywa==4.5.0", "fastapi==0.162.2", "uvicorn==0.54.0"]

[project.scripts]
turncheck = "turncheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
